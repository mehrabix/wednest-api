services:
  postgres:
    image: postgres:16-alpine
    container_name: wednest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wednest_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-4203874}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wednest_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: wednest-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-ahmad}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-4203874}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo OK >&3"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wednest-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: wednest_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-4203874}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: wednest
      KEYCLOAK_CLIENT_ID: wednest-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-wednest-api-secret-key-2024}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-ahmad}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-4203874}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-your-merchant-id}
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_CALLBACK_URL: http://localhost:5000/api/payments/callback
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "5000:5000"

volumes:
  pgdata:
